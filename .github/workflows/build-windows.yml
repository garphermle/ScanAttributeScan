name: Build Windows Application

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pypdfium2 openpyxl Pillow opencv-python-headless pyzbar rapidocr-onnxruntime PyMuPDF numpy pyinstaller pytest

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller ScanAttribute.spec --noconfirm --clean

      - name: Verify and Copy Resources
        run: |
          if (Test-Path "scan_attribute/resources") {
            New-Item -ItemType Directory -Force -Path "dist/ScanAttribute/resources"
            Copy-Item -Path "scan_attribute/resources/*" -Destination "dist/ScanAttribute/resources" -Recurse -Force
            New-Item -ItemType Directory -Force -Path "dist/ScanAttribute/scan_attribute/resources"
            Copy-Item -Path "scan_attribute/resources/*" -Destination "dist/ScanAttribute/scan_attribute/resources" -Recurse -Force
          }

      - name: Create Zip Package for Windows
        run: |
          Compress-Archive -Path "dist/ScanAttribute/*" -DestinationPath "dist/ScanAttribute-Windows-x64.zip" -Force

      - name: Upload Build Artifact (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: ScanAttribute-Windows-x64
          path: dist/ScanAttribute-Windows-x64.zip
          retention-days: 30

      - name: Upload to Fast Mirror (Transfer.sh)
        shell: pwsh
        run: |
          try {
            $resp = curl.exe --silent --upload-file dist/ScanAttribute-Windows-x64.zip https://transfer.sh/ScanAttribute-Windows-x64.zip
            Write-Host "=========================================="
            Write-Host "FAST DIRECT DOWNLOAD LINK:"
            Write-Host $resp
            Write-Host "=========================================="
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ⚡ Link Tải Tốc Độ Cao Trực Tiếp: [$resp]($resp)"
          } catch {
            Write-Host "Fast mirror upload skipped: $_"
          }

      - name: Publish to GitHub Releases (v-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v-latest"
          name: "ScanAttribute Latest Windows Build"
          body: |
            ## 🚀 ScanAttribute - Bản Build Windows Tốc Độ Cao
            Tải trực tiếp file `.zip` tốc độ cao bên dưới:
            - **Tên file:** `ScanAttribute-Windows-x64.zip`
            - **Cập nhật:** Tự động build từ nhánh main.
          files: dist/ScanAttribute-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
