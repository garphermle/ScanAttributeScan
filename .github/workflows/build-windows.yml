name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pytest pytest-qt

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Build Folder Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name ScanAttribute `
            --add-data "scan_attribute/resources/Excel_FormMau.xlsx;scan_attribute/resources" `
            --add-data "scan_attribute/resources/QNH_ThongTinDoDac.xlsx;scan_attribute/resources" `
            --collect-all rapidocr_onnxruntime `
            --collect-all pypdfium2 `
            scan_attribute/main.py

      - name: Build Standalone Single File EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name ScanAttribute-Standalone `
            --add-data "scan_attribute/resources/Excel_FormMau.xlsx;scan_attribute/resources" `
            --add-data "scan_attribute/resources/QNH_ThongTinDoDac.xlsx;scan_attribute/resources" `
            --collect-all rapidocr_onnxruntime `
            --collect-all pypdfium2 `
            scan_attribute/main.py

      - name: Compress Directory Build Artifact
        shell: powershell
        run: |
          Compress-Archive -Path dist/ScanAttribute/* -DestinationPath ScanAttribute-Windows-x64.zip

      - name: Upload Directory Build Artifact (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: ScanAttribute-Windows-x64-Zip
          path: ScanAttribute-Windows-x64.zip
          retention-days: 90

      - name: Upload Standalone EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanAttribute-Standalone-EXE
          path: dist/ScanAttribute-Standalone.exe
          retention-days: 90

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScanAttribute-Windows-x64.zip
            dist/ScanAttribute-Standalone.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
