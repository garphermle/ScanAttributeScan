[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scan_attribute"
version = "1.0.0"
description = "Tool Nhập Liệu Thuộc Tính Đất Đai Siêu Tốc Cho Con Người"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "pypdfium2>=4.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0"
]

[project.scripts]
scan-attribute = "scan_attribute.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
scan_attribute = ["resources/*", "resources/*.xlsx"]

